# cargo-deny policy for the connectrpc-hyper native graph: permissive licenses
# only, crates.io only, no proxy-reading crates or features, and RustSec
# advisories (unmaintained and yanked crates included) fail the check.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Ruby resolves proxies through core's ConnectRPC::Proxy and passes only the
# endpoint: nothing in the native graph may read proxy settings from the
# environment or the operating system.
deny = [
  { crate = "system-configuration", reason = "reads macOS proxy settings" },
  { crate = "windows-registry", reason = "reads Windows proxy settings" },
]

[[bans.features]]
crate = "hyper-util"
deny = ["client-proxy", "client-proxy-system", "full"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
