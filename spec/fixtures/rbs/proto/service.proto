syntax = "proto3";
package rbs_service.v1;
option ruby_package = "rbs_fixture.api";
import "types.proto";
import "ordinary.proto";
import "google/protobuf/empty.proto";
service Echo {
  rpc Exchange(rbs_types.v1.Envelope.Request) returns (rbs_types.v1.Envelope.Reply);
  rpc Plain(rbs_plain.v1.Request) returns (rbs_plain.v1.Outer.Reply);
  rpc Reset(google.protobuf.Empty) returns (google.protobuf.Empty);
}
service NoCalls {}
service Single { rpc Exchange(rbs_types.v1.Envelope.Request) returns (rbs_types.v1.Envelope.Reply); }
