# Action-provided Ruby; the pinned Rust toolchain and Rust lint tools install
# from mise.lock as locally.
[tasks."hyper:tools"]
description = "Validate action Ruby/Bundler, install pinned Rust tools and check independent connectrpc-hyper bundle settings"
dir = "{{config_root}}/gems/connectrpc-hyper"
tools.rust = "1.98.0"
tools."aqua:EmbarkStudios/cargo-deny" = "0.20.2"
tools."aqua:rustsec/rustsec/cargo-audit" = "0.23.0"
env = { BUNDLE_GEMFILE = "{{config_root}}/gems/connectrpc-hyper/Gemfile", BUNDLE_PATH = "{{config_root}}/vendor/hyper/bundle", BUNDLE_USER_HOME = "{{config_root}}/vendor/hyper/bundler", BUNDLE_COOLDOWN = "3" }
run = ["mise install --locked rust@1.98.0 aqua:EmbarkStudios/cargo-deny@0.20.2 aqua:rustsec/rustsec/cargo-audit@0.23.0", "ruby scripts/ci_runtime.rb"]

# A command-bearing override replaces the whole task; keep this context aligned
# with mise.toml. Only the Go installation differs: setup-go provides it.
[tasks."hyper:peer"]
description = "Validate action-provided Go and build the disposable grpc-go/connect-go/raw HTTP/2 peer used by connectrpc-hyper specs"
tools.go = "1.27.3"
dir = "{{config_root}}/gems/connectrpc-hyper/interop"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/hyper/go/mod", GOCACHE = "{{config_root}}/vendor/hyper/go/build" }
run = ["ruby {{config_root}}/scripts/ci_runtime.rb hyper", "go mod download all", "go mod verify", "go vet .", "go build -o ../../../vendor/hyper/peer ."]
