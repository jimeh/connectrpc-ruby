# Official setup actions own CI runtimes. Local source-build tasks stay unchanged.
[settings]
disable_tools = ["ruby", "go"]
# Also covers nested `mise exec`, independently of task.run_auto_install.
exec_auto_install = false

[tasks."setup:tools"]
description = "Validate the action-provided Ruby and frozen bundle configuration"
run = "ruby {{config_root}}/scripts/ci_runtime.rb"

# A command-bearing override replaces the WHOLE task, including tools/env/dir.
# Keep this context aligned with mise.toml; only runtime installation differs.
[tasks."setup:interop"]
description = "Validate action-provided Go and download checksum-locked modules"
tools.go = "1.27.3"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/interop/mod", GOCACHE = "{{config_root}}/vendor/interop/build" }
dir = "{{config_root}}/interop"
run = ["ruby {{config_root}}/scripts/ci_runtime.rb interop", "go mod download"]

[tasks."browser:reference:setup"]
description = "Validate action-provided Go and build the audited gRPC-Web text reference"
tools.go = "1.27.3"
dir = "{{config_root}}/browser/reference"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/browser/go/mod", GOCACHE = "{{config_root}}/vendor/browser/go/build" }
run = ["ruby {{config_root}}/scripts/ci_runtime.rb browser-reference", "go mod download all", "go mod verify", "ruby ../../scripts/check_web_reference.rb", "go build -o ../../vendor/browser/reference ."]

[tasks."async:tools"]
description = "Validate exact action Ruby/Bundler and the independent backend bundle"
dir = "{{config_root}}/gems/connectrpc-async"
env = { BUNDLE_GEMFILE = "{{config_root}}/gems/connectrpc-async/Gemfile", BUNDLE_PATH = "{{config_root}}/vendor/async/bundle", BUNDLE_USER_HOME = "{{config_root}}/vendor/async/bundler", BUNDLE_COOLDOWN = "7" }
run = "ruby scripts/ci_runtime.rb"

[tasks."rack:tools"]
description = "Validate exact action Ruby/Bundler and the independent middleware bundle"
dir = "{{config_root}}/gems/connectrpc-rack"
env = { BUNDLE_GEMFILE = "{{config_root}}/gems/connectrpc-rack/Gemfile", BUNDLE_PATH = "{{config_root}}/vendor/rack/bundle", BUNDLE_USER_HOME = "{{config_root}}/vendor/rack/bundler", BUNDLE_COOLDOWN = "7" }
run = "ruby scripts/ci_runtime.rb"

[tasks."testing:tools"]
description = "Validate action Ruby/Bundler and independent testing bundle settings"
dir = "{{config_root}}/gems/connectrpc-testing"
env = { BUNDLE_GEMFILE = "{{config_root}}/gems/connectrpc-testing/Gemfile", BUNDLE_PATH = "{{config_root}}/vendor/testing/bundle", BUNDLE_USER_HOME = "{{config_root}}/vendor/testing/bundler", BUNDLE_COOLDOWN = "7" }
run = "ruby scripts/ci_runtime.rb"

[tasks."falcon:tools"]
description = "Validate exact action Ruby/Bundler and the independent backend bundle"
dir = "{{config_root}}/gems/connectrpc-falcon"
env = { BUNDLE_GEMFILE = "{{config_root}}/gems/connectrpc-falcon/Gemfile", BUNDLE_PATH = "{{config_root}}/vendor/falcon/bundle", BUNDLE_USER_HOME = "{{config_root}}/vendor/falcon/bundler", BUNDLE_COOLDOWN = "7" }
run = "ruby scripts/ci_runtime.rb"

[tasks."otel:tools"]
description = "Validate action Ruby/Bundler and independent OpenTelemetry bundle settings"
dir = "{{config_root}}/gems/connectrpc-otel"
env = { BUNDLE_GEMFILE = "{{config_root}}/gems/connectrpc-otel/Gemfile", BUNDLE_PATH = "{{config_root}}/vendor/otel/bundle", BUNDLE_USER_HOME = "{{config_root}}/vendor/otel/bundler", BUNDLE_COOLDOWN = "7" }
