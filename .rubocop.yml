AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - vendor/**/*
    - pkg/**/*
    - coverage/**/*
    # Official protoc output is checked by regeneration, not rewritten by lint.
    - spec/fixtures/generation/**/*_pb.rb

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# Publication is disabled; there is no public RubyGems account policy to assert.
Gemspec/RequireMFA:
  Enabled: false

# Scenario harnesses keep setup, assertions and deterministic cleanup together.
Metrics/BlockLength:
  Exclude:
    - spec/**/*.rb
    - scripts/check_package.rb
    - scripts/build_generation.rb
    - scripts/generated_interop.rb
    - scripts/interop.rb
    - scripts/conformance.rb
    - conformance/**/*.rb

# Descriptor validation keeps each related invariant together; emission methods
# mirror generated Ruby blocks. These files still receive all syntax/style cops.
Metrics/MethodLength:
  Exclude:
    - lib/connectrpc/generator/schema.rb
    - lib/connectrpc/generator/renderer.rb
    - lib/connectrpc/generator/names.rb
    - spec/**/*.rb
    - scripts/interop.rb
    - scripts/conformance.rb
    - conformance/**/*.rb
    - examples/localhost.rb

Metrics/AbcSize:
  Exclude:
    - lib/connectrpc/generator/schema.rb
    - lib/connectrpc/generator/renderer.rb
    - spec/**/*.rb
    - scripts/interop.rb
    - scripts/conformance.rb
    - conformance/**/*.rb

# Public configuration uses named options rather than positional argument bags.
Metrics/ParameterLists:
  CountKeywordArgs: false

# The version-pinned log parser keeps its complete protocol cases together.
Metrics/ClassLength:
  Exclude:
    - conformance/ledger.rb
    - lib/connectrpc/generator/schema.rb

Metrics/CyclomaticComplexity:
  Exclude:
    - lib/connectrpc/generator/schema.rb
    - spec/support/socket_peer.rb
    - conformance/ledger.rb
    - conformance/client.rb
    - conformance/server.rb

Metrics/PerceivedComplexity:
  Exclude:
    - lib/connectrpc/generator/schema.rb
    - spec/support/socket_peer.rb
    - conformance/ledger.rb
    - conformance/client.rb
    - conformance/server.rb

# Official protobuf enum identifiers.
Naming/VariableNumber:
  AllowedIdentifiers:
    - HTTP_VERSION_1
    - HTTP_VERSION_2

# Service module names follow official RubifyConstant, which preserves underscores.
Naming/ClassAndModuleCamelCase:
  Exclude:
    - spec/fixtures/generation/**/*_connect.rb

# The generated public seam deliberately spells out the forwarded option bag.
Style/ArgumentsForwarding:
  Exclude:
    - spec/fixtures/generation/**/*_connect.rb
