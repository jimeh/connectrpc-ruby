AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - vendor/**/*
    - pkg/**/*
    - coverage/**/*
    # Official protoc output is checked by regeneration, not rewritten by lint.
    - spec/fixtures/generation/**/*_pb.rb
    - interop/grpc/ruby/**/*.rb
    # Appraisal output is byte-checked with its actual generator.
    - gems/connectrpc-rails/gemfiles/**/*

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# Scenario harnesses keep setup, assertions and deterministic cleanup together.
Metrics/BlockLength:
  Exclude:
    - typecheck/prove.rb
    - typecheck/package.rb
    - typecheck/runtime.rb
    - spec/**/*.rb
    - gems/connectrpc-rack/spec/**/*.rb
    - gems/connectrpc-rack/scripts/**/*.rb
    - gems/connectrpc-rails/spec/**/*.rb
    - gems/connectrpc-async/spec/**/*.rb
    - gems/connectrpc-otel/spec/**/*.rb
    - gems/connectrpc-otel/scripts/**/*.rb
    - gems/connectrpc-testing/spec/**/*.rb
    - gems/connectrpc-testing/scripts/**/*.rb
    - gems/connectrpc-falcon/spec/**/*.rb
    - gems/connectrpc-async/scripts/**/*.rb
    - gems/connectrpc-falcon/scripts/**/*.rb
    - scripts/check_package.rb
    - scripts/build_generation.rb
    - scripts/generated_integration.rb
    - scripts/generated_interop.rb
    - scripts/interop.rb
    - scripts/conformance.rb
    - conformance/**/*.rb

# Descriptor validation keeps each related invariant together; emission methods
# mirror generated Ruby blocks. These files still receive all syntax/style cops.
Metrics/MethodLength:
  Exclude:
    - typecheck/source.rb
    - typecheck/capture.rb
    - typecheck/archive.rb
    - typecheck/api_check.rb
    - typecheck/surface.rb
    - typecheck/installed_api.rb
    - typecheck/harness.rb
    - typecheck/negative_check.rb
    - gems/connectrpc-async/lib/connectrpc/async/*.rb
    - gems/connectrpc-falcon/lib/connectrpc/falcon/*.rb
    - lib/connectrpc/generator/schema.rb
    - lib/connectrpc/generator/renderer.rb
    - lib/connectrpc/generator/rbs_renderer.rb
    - lib/connectrpc/generator/names.rb
    - spec/**/*.rb
    - gems/connectrpc-rack/spec/**/*.rb
    - gems/connectrpc-rack/scripts/**/*.rb
    - gems/connectrpc-rails/spec/**/*.rb
    - gems/connectrpc-async/spec/**/*.rb
    - gems/connectrpc-otel/spec/**/*.rb
    - gems/connectrpc-otel/scripts/**/*.rb
    - gems/connectrpc-testing/spec/**/*.rb
    - gems/connectrpc-testing/scripts/**/*.rb
    - gems/connectrpc-falcon/spec/**/*.rb
    - gems/connectrpc-async/scripts/**/*.rb
    - gems/connectrpc-falcon/scripts/**/*.rb
    - scripts/interop.rb
    - scripts/conformance.rb
    - conformance/**/*.rb
    - examples/localhost.rb

Metrics/AbcSize:
  Exclude:
    - typecheck/source.rb
    - typecheck/capture.rb
    - typecheck/archive.rb
    - typecheck/api_check.rb
    - typecheck/surface.rb
    - typecheck/installed_api.rb
    - typecheck/harness.rb
    - typecheck/negative_check.rb
    - gems/connectrpc-async/lib/connectrpc/async/*.rb
    - gems/connectrpc-falcon/lib/connectrpc/falcon/*.rb
    - lib/connectrpc/generator/schema.rb
    - lib/connectrpc/generator/renderer.rb
    - lib/connectrpc/generator/rbs_renderer.rb
    - spec/**/*.rb
    - gems/connectrpc-rack/spec/**/*.rb
    - gems/connectrpc-rack/scripts/**/*.rb
    - gems/connectrpc-rails/spec/**/*.rb
    - gems/connectrpc-async/spec/**/*.rb
    - gems/connectrpc-otel/spec/**/*.rb
    - gems/connectrpc-otel/scripts/**/*.rb
    - gems/connectrpc-testing/spec/**/*.rb
    - gems/connectrpc-testing/scripts/**/*.rb
    - gems/connectrpc-falcon/spec/**/*.rb
    - gems/connectrpc-async/scripts/**/*.rb
    - gems/connectrpc-falcon/scripts/**/*.rb
    - scripts/interop.rb
    - scripts/conformance.rb
    - conformance/**/*.rb

# Public configuration uses named options rather than positional argument bags.
Metrics/ParameterLists:
  CountKeywordArgs: false

# The version-pinned log parser keeps its complete protocol cases together.
Metrics/ClassLength:
  Exclude:
    - gems/connectrpc-async/lib/connectrpc/async/*.rb
    - gems/connectrpc-falcon/lib/connectrpc/falcon/*.rb
    - conformance/ledger.rb
    - lib/connectrpc/generator/schema.rb

Metrics/CyclomaticComplexity:
  Exclude:
    - typecheck/source.rb
    - typecheck/capture.rb
    - typecheck/archive.rb
    - typecheck/api_check.rb
    - typecheck/surface.rb
    - typecheck/installed_api.rb
    - typecheck/harness.rb
    - typecheck/negative_check.rb
    - gems/connectrpc-async/lib/connectrpc/async/*.rb
    - gems/connectrpc-falcon/lib/connectrpc/falcon/*.rb
    - lib/connectrpc/generator/schema.rb
    - spec/support/socket_peer.rb
    - gems/connectrpc-async/spec/support/helpers.rb
    - gems/connectrpc-falcon/spec/support/helpers.rb
    - conformance/ledger.rb
    - conformance/client.rb
    - conformance/server.rb

Metrics/PerceivedComplexity:
  Exclude:
    - typecheck/negative_check.rb
    - typecheck/source.rb
    - typecheck/capture.rb
    - typecheck/archive.rb
    - typecheck/api_check.rb
    - typecheck/surface.rb
    - typecheck/installed_api.rb
    - gems/connectrpc-async/lib/connectrpc/async/*.rb
    - gems/connectrpc-falcon/lib/connectrpc/falcon/*.rb
    - lib/connectrpc/generator/schema.rb
    - spec/support/socket_peer.rb
    - gems/connectrpc-async/spec/support/helpers.rb
    - gems/connectrpc-falcon/spec/support/helpers.rb
    - conformance/ledger.rb
    - conformance/client.rb
    - conformance/server.rb

# Official protobuf enum identifiers.
Naming/VariableNumber:
  AllowedIdentifiers:
    - HTTP_VERSION_1
    - HTTP_VERSION_2

# Service module names follow official RubifyConstant, which preserves underscores.
Naming/ClassAndModuleCamelCase:
  Exclude:
    - spec/fixtures/generation/**/*_connect.rb

# The generated public seam deliberately spells out the forwarded option bag.
Style/ArgumentsForwarding:
  Exclude:
    - spec/fixtures/generation/**/*_connect.rb

# These scripts execute a bounded, standalone fixture scenario in one process.
Style/MixinUsage:
  Exclude:
    - gems/connectrpc-async/scripts/integration.rb
    - gems/connectrpc-falcon/scripts/integration.rb
    - gems/connectrpc-async/scripts/interop.rb
    - gems/connectrpc-falcon/scripts/interop.rb

Naming/PredicateMethod:
  AllowedMethods:
    - drain_resources
    - rewind

# Consumer fixtures exercise multiple independently signed callable objects.
Style/OneClassPerFile:
  Exclude:
    - typecheck/consumers/support.rb
    - typecheck/api/support.rb
    - typecheck/installed_runtime.rb

# Keep Steep/RBS assertions recognizable during ordinary formatting.
Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true
