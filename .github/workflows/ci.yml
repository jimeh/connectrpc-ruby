          cache-version: bundler-4.0.23-v1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          check-latest: false
          cache: true
          cache-dependency-path: browser/reference/go.sum
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: true
          install_args: github:connectrpc/conformance@1.0.6 aqua:protocolbuffers/protobuf/protoc@36.2
          cache: true
          cache_key_prefix: connectrpc-ci-tools-v1
      - name: Verify official browser clients and real cross-origin Ruby hosts
        run: mise run browser:verify
      - name: Verify exact binary Web conformance inventories
        run: |
          mise run async:conformance:web
          mise run falcon:conformance:web
          mise run rack:conformance:web
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi
