  # Builds, smokes and verifies all nine connectrpc-hyper archives, as the
  # release workflow does before publishing.
  hyper_gems:
    name: Hyper gems
    # GitHub resolves a local reusable workflow from the caller's commit, not the
    # workspace; actionlint 1.7.12 does not accept the `$/` form yet.
    uses: ./.github/workflows/hyper-gems.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  # Provisional Windows x64 evidence: the cross-built gem installs and smokes,
  # then the specs that apply off Linux and the Go interop subset run against
  # it. Tags exclude fork, the LD_PRELOAD DNS shim and /proc or accept-backlog probes.
  hyper_windows:
    name: Hyper gem x64-mingw-ucrt on Windows / Ruby ${{ matrix.ruby }} (non-gating)
    needs: hyper_gems
    runs-on: windows-2025
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
    defaults:
      run:
        shell: bash
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gems/connectrpc-hyper/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/vendor/hyper/bundle
      BUNDLE_USER_HOME: ${{ github.workspace }}/vendor/hyper/bundler
      BUNDLE_COOLDOWN: "3"
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          check-latest: false
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: connectrpc-hyper-x64-mingw-ucrt
          path: vendor/hyper/cross/x64-mingw-ucrt
      - name: Install the platform gem offline and smoke it
        run: ruby gems/connectrpc-hyper/scripts/install_smoke.rb vendor/hyper/cross/x64-mingw-ucrt
      - name: Build the Go peer
        working-directory: gems/connectrpc-hyper/interop
        run: |
          go mod download all
          go mod verify
          go build -o ../../../vendor/hyper/peer.exe .
      - name: Run the hyper specs against the artifact
        working-directory: gems/connectrpc-hyper
        run: |
          ruby scripts/use_artifact.rb ../../vendor/hyper/cross/x64-mingw-ucrt
          bundle exec rspec --tag "~interop" --tag "~fork" --tag "~dns_shim" --tag "~linux_only"
      - name: Run the Go interop subset against the artifact
        working-directory: gems/connectrpc-hyper
        run: bundle exec rspec --tag interop --tag "~linux_only"
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

