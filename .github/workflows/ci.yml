name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_ENV: ci
  MISE_LOCKED: "1"
  BUNDLE_IGNORE_CONFIG: "true"
  BUNDLE_FROZEN: "true"
  BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
  BUNDLE_DISABLE_SHARED_GEMS: "true"
  BUNDLE_VERSION: "4.0.23"

jobs:
  static:
    name: Static
    runs-on: ubuntu-24.04
    env:
      CI_EXPECTED_RUBY_VERSION: "3.4.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4.12"
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: true
          install_args: actionlint zizmor
          cache: true
          cache_key_prefix: connectrpc-ci-tools-v1
      - name: Run check:static
        run: mise run check:static
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

  specs:
    name: Specs / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12", "4.0.9"]
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: false
          cache: false
      - name: Run syntax
        run: mise run syntax
      - name: Run test
        run: mise run test
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

  package:
    name: Package / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12", "4.0.9"]
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: true
          install_args: aqua:protocolbuffers/protobuf/protoc@36.2 aqua:bufbuild/buf@1.75.0
          cache: true
          cache_key_prefix: connectrpc-ci-tools-v1
      - name: Run generation:check
        run: mise run generation:check
      - name: Run check:package
        run: mise run check:package
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

  interop:
    name: Go interoperability / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12", "4.0.9"]
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      GOMODCACHE: ${{ github.workspace }}/vendor/interop/mod
      GOCACHE: ${{ github.workspace }}/vendor/interop/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          check-latest: false
          cache: true
          cache-dependency-path: interop/go.sum
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: false
          cache: false
      - name: Run fixture:check
        run: mise run fixture:check
      - name: Run test:interop
        run: mise run test:interop
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

  conformance:
    name: Official conformance / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12", "4.0.9"]
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: true
          install_args: github:connectrpc/conformance@1.0.6 aqua:protocolbuffers/protobuf/protoc@36.2
          cache: true
          cache_key_prefix: connectrpc-ci-tools-v1
      - name: Run test:conformance
        run: mise run test:conformance
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

  rails:
    name: Rails ${{ matrix.rails }} / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rails: "8.0", ruby: "3.4.12" }
          - { rails: "8.1", ruby: "3.4.12" }
          - { rails: "8.1", ruby: "4.0.9" }
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
      RAILS_LANE: ${{ matrix.rails }}
      BUNDLE_COOLDOWN: "7"
      BUNDLE_USER_HOME: ${{ github.workspace }}/vendor/rails/bundler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/gems/connectrpc-rails/gemfiles/rails_${{ matrix.rails }}.gemfile
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: false
          cache: false
      - name: Run test:rails
        run: mise run test:rails
      - name: Run generation:check:rails
        run: mise run generation:check:rails
      - name: Run check:package:rails
        run: mise run check:package:rails
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

  async_specs:
    name: Async specs and package / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12", "4.0.9"]
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gems/connectrpc-async/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/vendor/async/bundle
      BUNDLE_USER_HOME: ${{ github.workspace }}/vendor/async/bundler
      BUNDLE_COOLDOWN: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: true
          install_args: github:connectrpc/conformance@1.0.6 aqua:protocolbuffers/protobuf/protoc@36.2
          cache: true
          cache_key_prefix: connectrpc-ci-tools-v1
      - name: Run async:test
        run: mise run async:test
      - name: Run async:package
        run: mise run async:package
      - name: Run async:conformance
        run: mise run async:conformance
      - name: Run async:conformance:grpc
        run: mise run async:conformance:grpc
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

  async_interop:
    name: Async Go interoperability / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12", "4.0.9"]
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gems/connectrpc-async/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/vendor/async/bundle
      BUNDLE_USER_HOME: ${{ github.workspace }}/vendor/async/bundler
      BUNDLE_COOLDOWN: "7"
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      GOMODCACHE: ${{ github.workspace }}/vendor/interop/mod
      GOCACHE: ${{ github.workspace }}/vendor/interop/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          check-latest: false
          cache: true
          cache-dependency-path: interop/go.sum
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: false
          cache: false
      - name: Run async:interop
        run: mise run async:interop
      - name: Run async:interop:streaming
        run: mise run async:interop:streaming
      - name: Run async:interop:grpc
        run: mise run async:interop:grpc
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

  rack:
    name: Rack specs and package / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12", "4.0.9"]
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gems/connectrpc-rack/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/vendor/rack/bundle
      BUNDLE_USER_HOME: ${{ github.workspace }}/vendor/rack/bundler
      BUNDLE_COOLDOWN: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: false
          cache: false
      - name: Run rack:test
        run: mise run rack:test
      - name: Run rack:check
        run: mise run rack:check
      - name: Run rack:package
        run: mise run rack:package
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

  testing:
    name: In-process testing / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12", "4.0.9"]
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gems/connectrpc-testing/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/vendor/testing/bundle
      BUNDLE_USER_HOME: ${{ github.workspace }}/vendor/testing/bundler
      BUNDLE_COOLDOWN: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: false
          cache: false
      - name: Run testing package checks, specs, example and isolated install
        run: mise run testing:verify
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

  rbs:
    name: RBS consumers and package / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12", "4.0.9"]
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: false
          cache-version: bundler-4.0.23-v1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: true
          install_args: aqua:protocolbuffers/protobuf/protoc@36.2 aqua:bufbuild/buf@1.75.0
          cache: true
          cache_key_prefix: connectrpc-ci-tools-v1
      - name: Identify RBS native cache platform
        id: rbs-platform
        run: mise run rbs:cache-platform
      - name: Cache RBS and installed-package dependency bundles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor/bundle
            vendor/rbs/bundle
            vendor/rack/bundle
            vendor/testing/bundle
            vendor/async/bundle
            vendor/falcon/bundle
            vendor/otel/bundle
          key: rbs-bundles-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rbs-platform.outputs.platform }}-bundler-4.0.23-${{ hashFiles('Gemfile*', 'connectrpc.gemspec', 'typecheck/Gemfile*', 'gems/**/Gemfile*', 'gems/**/*.gemfile*', 'gems/**/*.gemspec') }}
      - name: Run rbs:check
        run: mise run rbs:check
      - name: Run rbs:package
        run: mise run rbs:package
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

  falcon_specs:
    name: Falcon specs and package / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12", "4.0.9"]
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gems/connectrpc-falcon/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/vendor/falcon/bundle
      BUNDLE_USER_HOME: ${{ github.workspace }}/vendor/falcon/bundler
      BUNDLE_COOLDOWN: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: true
          install_args: github:connectrpc/conformance@1.0.6 aqua:protocolbuffers/protobuf/protoc@36.2
          cache: true
          cache_key_prefix: connectrpc-ci-tools-v1
      - name: Run falcon:test
        run: mise run falcon:test
      - name: Run falcon:package
        run: mise run falcon:package
      - name: Run falcon:conformance
        run: mise run falcon:conformance
      - name: Run falcon:conformance:grpc
        run: mise run falcon:conformance:grpc
      - name: Run falcon:conformance:http1
        run: mise run falcon:conformance:http1
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi

  falcon_interop:
    name: Falcon Go interoperability / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12", "4.0.9"]
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gems/connectrpc-falcon/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/vendor/falcon/bundle
      BUNDLE_USER_HOME: ${{ github.workspace }}/vendor/falcon/bundler
      BUNDLE_COOLDOWN: "7"
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      GOMODCACHE: ${{ github.workspace }}/vendor/interop/mod
      GOCACHE: ${{ github.workspace }}/vendor/interop/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          check-latest: false
          cache: true
          cache-dependency-path: interop/go.sum
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
