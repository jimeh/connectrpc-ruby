  browser_grpc_web:
    name: Browser gRPC-Web / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12", "4.0.9"]
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
      GOMODCACHE: ${{ github.workspace }}/vendor/browser/go/mod
      GOCACHE: ${{ github.workspace }}/vendor/browser/go/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
