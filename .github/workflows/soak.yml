name: Lifecycle campaign

# Non-gating: never runs on pull requests or pushes. Runs the long-running
# connection and resource lifecycle campaign (mise run <package>:soak) for the
# Async and Falcon packages on both Ruby lanes, and keeps its JSON lines and
# Markdown report whatever the outcome. See docs/ci.md.
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_ENV: ci
  MISE_LOCKED: "1"
  BUNDLE_IGNORE_CONFIG: "true"
  BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
  BUNDLE_DISABLE_SHARED_GEMS: "true"
  BUNDLE_VERSION: "4.0.23"
  # 50 rounds per scenario. The run deadline and cleanup budget leave room for
  # setup and the report upload inside the 60-minute job timeout.
  CONNECTRPC_SOAK_ROUNDS: "50"
  CONNECTRPC_SOAK_DEADLINE: "2700"
  CONNECTRPC_SOAK_CLEANUP: "120"

jobs:
  soak:
    name: Lifecycle campaign ${{ matrix.package }} / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [async, falcon]
        ruby: ["3.4.12", "4.0.9"]
    env:
      CI_EXPECTED_RUBY_VERSION: ${{ matrix.ruby }}
      BUNDLE_COOLDOWN: "3"
      SOAK_PACKAGE: ${{ matrix.package }}
      SOAK_RUBY: ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The package setup task installs its own independent bundle.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: false
          cache-version: bundler-4.0.23-v1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: false
          cache: false
      - name: Run the lifecycle campaign
        run: mise run "$SOAK_PACKAGE:soak"
      - name: Write the job summary
        if: always()
        run: |
          summary="vendor/$SOAK_PACKAGE/soak/$SOAK_RUBY/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The lifecycle campaign wrote no summary." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the campaign report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-${{ matrix.package }}-ruby-${{ matrix.ruby }}
          path: vendor/${{ matrix.package }}/soak/${{ matrix.ruby }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Check workspace stayed clean
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            exit 1
          fi
