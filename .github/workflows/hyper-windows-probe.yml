# PROBE(#175): temporary Windows diagnostics; removed before review.
name: Hyper Windows probe

on:
  push:
    branches: [fix/hyper-windows-reactor-waits]

permissions:
  contents: read

concurrency:
  group: hyper-windows-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross:
    name: Probe cross ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [x64-mingw-ucrt, aarch64-mingw-ucrt]
    env:
      CI_EXPECTED_RUBY_VERSION: "3.4.12"
      BUNDLE_GEMFILE: ${{ github.workspace }}/gems/connectrpc-hyper/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/vendor/hyper/bundle
      BUNDLE_USER_HOME: ${{ github.workspace }}/vendor/hyper/bundler
      BUNDLE_COOLDOWN: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4.12"
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"
          add_shims_to_path: false
          env: false
          export_path: false
          install: false
          cache: false
      - name: Run hyper:cross
        env:
          PLATFORM: ${{ matrix.platform }}
        run: mise run hyper:cross
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-connectrpc-hyper-${{ matrix.platform }}
          path: vendor/hyper/cross/${{ matrix.platform }}/*.gem
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Probe ${{ matrix.platform }} / Ruby ${{ matrix.ruby }} / ${{ matrix.probe }}
    needs: cross
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
        probe: ["1"]
        include:
          - { platform: x64-mingw-ucrt, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gems/connectrpc-hyper/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/vendor/hyper/bundle
      BUNDLE_USER_HOME: ${{ github.workspace }}/vendor/hyper/bundler
      BUNDLE_COOLDOWN: "3"
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      HYPER_PROBE: ${{ matrix.probe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          check-latest: false
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: probe-connectrpc-hyper-${{ matrix.platform }}
          path: vendor/hyper/cross/${{ matrix.platform }}
      - name: Build the Go peer
        working-directory: gems/connectrpc-hyper/interop
        run: |
          go mod download all
          go build -o ../../../vendor/hyper/peer.exe .
      - name: Ruby facts
        run: ruby -e 'puts RUBY_DESCRIPTION; puts RbConfig::CONFIG.values_at("host_os", "arch").inspect'
      - name: Run the offload specs with probes
        working-directory: gems/connectrpc-hyper
        run: |
          ruby scripts/use_artifact.rb ../../vendor/hyper/cross/${{ matrix.platform }}
          bundle exec rspec spec/offload_spec.rb --format documentation -e PROBE

  windows_arm:
    name: Probe aarch64-mingw-ucrt / Ruby ${{ matrix.ruby }}
    needs: cross
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
    defaults:
      run:
        shell: bash
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gems/connectrpc-hyper/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/vendor/hyper/bundle
      BUNDLE_USER_HOME: ${{ github.workspace }}/vendor/hyper/bundler
      BUNDLE_COOLDOWN: "3"
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      HYPER_PROBE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "4.0.23"
          bundler-cache: true
          cache-version: bundler-4.0.23-v1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          check-latest: false
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: probe-connectrpc-hyper-aarch64-mingw-ucrt
          path: vendor/hyper/cross/aarch64-mingw-ucrt
      - name: Ruby facts
        run: ruby -e 'puts RUBY_DESCRIPTION; puts RbConfig::CONFIG.values_at("host_os", "arch").inspect; puts Gem::Platform.local'
      - name: Install the platform gem offline and smoke it
        run: ruby gems/connectrpc-hyper/scripts/install_smoke.rb vendor/hyper/cross/aarch64-mingw-ucrt
      - name: Build the Go peer
        working-directory: gems/connectrpc-hyper/interop
        run: |
          go mod download all
          go build -o ../../../vendor/hyper/peer.exe .
      - name: Run the offload specs with probes
        working-directory: gems/connectrpc-hyper
        run: |
          ruby scripts/use_artifact.rb ../../vendor/hyper/cross/aarch64-mingw-ucrt
          bundle exec rspec spec/offload_spec.rb --format documentation -e PROBE
