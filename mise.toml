min_version = "2026.9.14"

[settings]
lockfile = true
minimum_release_age = "7d"
ruby.compile = true
# ruby-build v20261023; keep installer code inside the dependency age policy.
ruby.ruby_build_repo = "https://github.com/rbenv/ruby-build.git#b6a92c15f0df872047c74f7dfa0b92dfd4de8a92"
task.run_auto_install = false

[tools]
ruby = ["3.4.12", "4.0.9"]
actionlint = "1.7.12"
zizmor = "1.31.1"

[env]
BUNDLE_IGNORE_CONFIG = "true"
BUNDLE_FROZEN = "true"
BUNDLE_PATH = "{{config_root}}/vendor/bundle"
BUNDLE_DISABLE_SHARED_GEMS = "true"
BUNDLE_VERSION = "4.0.23"

[tasks."setup:tools"]
description = "Install locked project tools"
run = "mise install --locked ruby actionlint zizmor"

[tasks."setup:bundler"]
description = "Install the pinned Bundler into the active Ruby"
depends = ["setup:tools"]
run = "mise exec -- ruby scripts/setup_bundler.rb"

[tasks.setup]
description = "Install tools, pinned Bundler, and the frozen bundle"
depends = ["setup:bundler"]
run = "mise exec -- bundle _4.0.23_ install"

[tasks.format]
description = "Format Ruby with RuboCop Layout cops"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec rake format"

[tasks."format:check"]
description = "Check Ruby formatting without writing"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec rake format:check"

[tasks.lint]
description = "Check non-Layout RuboCop cops"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec rake lint"

[tasks.syntax]
description = "Parse all maintained Ruby files"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec rake syntax"

[tasks.test]
description = "Run RSpec with local HTML and console coverage (accepts spec paths/options)"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec rspec"

[tasks.build]
description = "Build the private gem into pkg/"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec rake build"

[tasks."lint:workflows"]
description = "Check GitHub Actions syntax and security offline"
depends = ["setup:tools"]
run = ["mise exec -- actionlint", "mise exec -- zizmor --offline .github/workflows"]

[tasks."check:static"]
description = "Run platform-independent format, lint, and workflow checks"
depends = ["format:check", "lint", "lint:workflows"]

[tasks.check]
description = "Run fast static checks"
depends = ["check:static", "syntax"]

[tasks."check:package"]
description = "Install and require the built gem in isolation"
depends = ["build"]
run = "mise exec -- bundle _4.0.23_ exec rake check:package"

[tasks.verify]
description = "Run static checks, specs, installed package integration, Go interop and official conformance"
depends = ["check", "test", "check:package", "test:interop", "test:conformance"]

[tasks."fixture:build"]
description = "Rebuild the shared test descriptor from its explicit schema builder"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec ruby scripts/build_fixture.rb"

[tasks."fixture:check"]
description = "Check the shared Ruby/Go descriptor fixture is reproducible"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec ruby scripts/build_fixture.rb --check"

[tasks.example]
description = "Run an ephemeral Rack/NetHTTP typed unary example in both codecs"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec ruby examples/unary.rb"

[tasks."setup:interop"]
description = "Install the pinned Go peer toolchain and checksum-locked modules"
tools.go = "1.27.3"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/interop/mod", GOCACHE = "{{config_root}}/vendor/interop/build" }
dir = "{{config_root}}/interop"
run = ["mise install --locked go@1.27.3", "go mod download"]

[tasks."test:interop"]
description = "Run the Go reference baseline and cross-language unary subset in both codecs"
depends = ["setup", "setup:interop", "fixture:check"]
tools.go = "1.27.3"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/interop/mod", GOCACHE = "{{config_root}}/vendor/interop/build" }
run = "bundle _4.0.23_ exec ruby scripts/interop.rb"

[tasks."setup:conformance"]
description = "Install the pinned official conformance runner and protoc"
run = "mise install --locked github:connectrpc/conformance@1.0.6 aqua:protocolbuffers/protobuf/protoc@36.2"

[tasks."conformance:build"]
description = "Generate official conformance descriptors with pinned protoc"
depends = ["setup", "setup:conformance"]
tools."aqua:protocolbuffers/protobuf/protoc" = "36.2"
run = "bundle _4.0.23_ exec ruby scripts/build_conformance.rb"

[tasks."conformance:check"]
description = "Check official schemas and reproducible descriptor bytes"
depends = ["setup", "setup:conformance"]
tools."aqua:protocolbuffers/protobuf/protoc" = "36.2"
run = "bundle _4.0.23_ exec ruby scripts/build_conformance.rb --check"

[tasks."test:conformance"]
description = "Run official unary conformance (optional client/server and exact test name)"
depends = ["conformance:check"]
tools."github:connectrpc/conformance" = "1.0.6"
run = "bundle _4.0.23_ exec ruby scripts/conformance.rb"
