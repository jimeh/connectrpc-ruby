min_version = "2026.9.14"

[settings]
lockfile = true
minimum_release_age = "7d"
ruby.compile = true
# ruby-build v20261023; keep installer code inside the dependency age policy.
ruby.ruby_build_repo = "https://github.com/rbenv/ruby-build.git#b6a92c15f0df872047c74f7dfa0b92dfd4de8a92"
task.run_auto_install = false

[tools]
ruby = ["3.4.12", "4.0.9"]
actionlint = "1.7.12"
zizmor = "1.31.1"

[env]
RUBOCOP_CACHE_ROOT = "{{config_root}}/.rubocop_cache"
BUNDLE_IGNORE_CONFIG = "true"
BUNDLE_FROZEN = "true"
BUNDLE_PATH = "{{config_root}}/vendor/bundle"
BUNDLE_USER_HOME = "{{config_root}}/vendor/bundler"
BUNDLE_DISABLE_SHARED_GEMS = "true"
BUNDLE_VERSION = "4.0.23"

[tasks."setup:tools"]
description = "Install locked project tools"
run = "mise install --locked ruby actionlint zizmor"

[tasks."setup:bundler"]
description = "Install the pinned Bundler into the active Ruby"
depends = ["setup:tools"]
run = "mise exec -- ruby scripts/setup_bundler.rb"

[tasks.setup]
description = "Install tools, pinned Bundler, and the frozen bundle"
depends = ["setup:bundler"]
run = "mise exec -- bundle _4.0.23_ install"

[tasks.format]
description = "Format Ruby with RuboCop Layout cops"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec rake format"

[tasks."format:check"]
description = "Check Ruby formatting without writing"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec rake format:check"

[tasks.lint]
description = "Check non-Layout RuboCop cops"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec rake lint"

[tasks.syntax]
description = "Parse all maintained Ruby files"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec rake syntax"

[tasks.test]
description = "Run RSpec with local HTML and console coverage (accepts spec paths/options)"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec rspec"

[tasks.build]
description = "Build the experimental gem into pkg/"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec rake build"

[tasks."lint:workflows"]
description = "Check GitHub Actions syntax and security offline"
depends = ["setup:tools"]
run = ["mise exec -- actionlint", "mise exec -- zizmor --offline .github/workflows"]

[tasks."check:static"]
description = "Run platform-independent format, lint, and workflow checks"
depends = ["format:check", "lint", "lint:workflows"]

[tasks.check]
description = "Run fast static checks"
depends = ["check:static", "syntax"]

[tasks."check:package"]
description = "Install and require the built gem in isolation"
depends = ["build", "setup:generation"]
tools."aqua:protocolbuffers/protobuf/protoc" = "36.2"
run = "bundle _4.0.23_ exec rake check:package"

[tasks.verify]
description = "Run core checks, specs, packages, Go/official conformance, selected Rails lane, HTTP/2 and Falcon backends"
depends = ["check", "test", "check:package", "test:interop", "test:conformance", "generation:check", "verify:rails", "async:verify", "falcon:verify"]

[tasks."fixture:build"]
description = "Rebuild the shared test descriptor from its explicit schema builder"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec ruby scripts/build_fixture.rb"

[tasks."fixture:check"]
description = "Check the shared Ruby/Go descriptor fixture is reproducible"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec ruby scripts/build_fixture.rb --check"

[tasks.example]
description = "Run an ephemeral Rack/NetHTTP typed unary example in both codecs"
depends = ["setup"]
run = "mise exec -- bundle _4.0.23_ exec ruby examples/unary.rb"

[tasks."setup:interop"]
description = "Install the pinned Go peer toolchain and checksum-locked modules"
tools.go = "1.27.3"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/interop/mod", GOCACHE = "{{config_root}}/vendor/interop/build" }
dir = "{{config_root}}/interop"
run = ["mise install --locked go@1.27.3", "go mod download"]

[tasks."test:interop"]
description = "Run separately named identity/generated and gzip Go interoperability portions"
depends = ["setup", "setup:interop", "fixture:check"]
tools.go = "1.27.3"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/interop/mod", GOCACHE = "{{config_root}}/vendor/interop/build" }
run = "bundle _4.0.23_ exec ruby scripts/interop.rb"

[tasks."setup:conformance"]
description = "Install the pinned official conformance runner and protoc"
run = "mise install --locked github:connectrpc/conformance@1.0.6 aqua:protocolbuffers/protobuf/protoc@36.2"

[tasks."conformance:build"]
description = "Generate official conformance descriptors with pinned protoc"
depends = ["setup", "setup:conformance"]
tools."aqua:protocolbuffers/protobuf/protoc" = "36.2"
run = "bundle _4.0.23_ exec ruby scripts/build_conformance.rb"

[tasks."conformance:check"]
description = "Check official schemas and reproducible descriptor bytes"
depends = ["setup", "setup:conformance"]
tools."aqua:protocolbuffers/protobuf/protoc" = "36.2"
run = "bundle _4.0.23_ exec ruby scripts/build_conformance.rb --check"

[tasks."test:conformance"]
description = "Run separate identity and gzip official profiles (optional direction/exact name)"
depends = ["conformance:check"]
tools."github:connectrpc/conformance" = "1.0.6"
run = "bundle _4.0.23_ exec ruby scripts/conformance.rb"

[tasks."setup:generation"]
description = "Install checksum-locked protoc and development-only Buf"
run = "mise install --locked aqua:protocolbuffers/protobuf/protoc@36.2 aqua:bufbuild/buf@1.75.0"

[tasks."generation:build"]
description = "Regenerate official Ruby messages and service glue with protoc and Buf"
depends = ["setup", "setup:generation"]
tools."aqua:protocolbuffers/protobuf/protoc" = "36.2"
tools."aqua:bufbuild/buf" = "1.75.0"
env.BUF_CACHE_DIR = "{{config_root}}/vendor/buf/cache"
run = "bundle _4.0.23_ exec ruby scripts/build_generation.rb"

[tasks."generation:check"]
description = "Check protoc/Buf output parity and checked-in generation fixtures"
depends = ["setup", "setup:generation"]
tools."aqua:protocolbuffers/protobuf/protoc" = "36.2"
tools."aqua:bufbuild/buf" = "1.75.0"
env.BUF_CACHE_DIR = "{{config_root}}/vendor/buf/cache"
run = "bundle _4.0.23_ exec ruby scripts/build_generation.rb --check"

[tasks."example:generated"]
description = "Generate a service, then run typed localhost success and errors in both codecs"
depends = ["setup", "setup:generation"]
tools."aqua:protocolbuffers/protobuf/protoc" = "36.2"
run = "bundle _4.0.23_ exec ruby scripts/generated_example.rb"

# Optional Rails bundle, independent of the root development bundle.
[tasks."setup:rails"]
description = "Install the frozen selected Rails Appraisal lane (RAILS_LANE=8.0 or 8.1)"
depends = ["setup:bundler"]
env.BUNDLE_COOLDOWN = "7"
run = "mise exec -- ruby scripts/rails.rb setup"

[tasks."test:rails"]
description = "Run real Rails integration specs under the selected actual Appraisal lane"
depends = ["setup:rails"]
env.BUNDLE_COOLDOWN = "7"
run = "mise exec -- ruby scripts/rails.rb test"

[tasks."generation:check:rails"]
description = "Check actual Appraisal generation in a temporary relative-layout copy"
depends = ["setup:rails"]
env.BUNDLE_COOLDOWN = "7"
run = "mise exec -- ruby scripts/rails.rb generation:check"

[tasks."build:rails"]
description = "Build core and optional Rails archives into vendor/rails/pkg"
depends = ["setup:rails"]
env.BUNDLE_COOLDOWN = "7"
run = "mise exec -- ruby scripts/rails.rb build"

[tasks."check:package:rails"]
description = "Install core and Rails archives offline and dispatch installed Rails requests"
depends = ["build:rails"]
env.BUNDLE_COOLDOWN = "7"
run = "mise exec -- ruby scripts/rails.rb package"

[tasks."verify:rails"]
description = "Verify selected Rails specs, Appraisal generation and isolated packages"
depends = ["test:rails", "generation:check:rails", "check:package:rails"]

[tasks."async:setup"]
description = "Install the independent frozen HTTP/2 backend bundle"
depends = ["async:tools"]
run = "mise exec -- ruby gems/connectrpc-async/scripts/run.rb setup"

[tasks."async:test"]
description = "Run optional HTTP/2 backend product specs"
depends = ["async:setup"]
run = "mise exec -- ruby gems/connectrpc-async/scripts/run.rb test"

[tasks."async:check"]
description = "Check optional HTTP/2 backend source"
depends = ["async:setup"]
run = "mise exec -- ruby gems/connectrpc-async/scripts/run.rb check"

[tasks."async:build"]
description = "Build isolated core and HTTP/2 backend archives"
depends = ["async:setup"]
run = "mise exec -- ruby gems/connectrpc-async/scripts/run.rb build"

[tasks."async:package"]
description = "Install and exercise normal HTTP/2 gem dependencies offline"
depends = ["async:build"]
run = "mise exec -- ruby gems/connectrpc-async/scripts/run.rb package"

[tasks."async:example"]
description = "Run generated unary HTTP/2 localhost example"
depends = ["async:setup"]
run = "mise exec -- ruby gems/connectrpc-async/scripts/run.rb example"

[tasks."async:interop"]
description = "Run independent connect-go HTTP/2 interoperability"
depends = ["async:setup", "setup:interop"]
tools.go = "1.27.3"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/interop/mod", GOCACHE = "{{config_root}}/vendor/interop/build" }
run = "ruby gems/connectrpc-async/scripts/run.rb interop"

[tasks."async:verify"]
description = "Verify optional HTTP/2 specs, source, packages and Go interoperability"
depends = ["async:test", "async:check", "async:package", "async:interop"]

[tasks."async:tools"]
description = "Prepare exact Ruby/Bundler for the independent backend bundle"
dir = "{{config_root}}/gems/connectrpc-async"
env = { BUNDLE_GEMFILE = "{{config_root}}/gems/connectrpc-async/Gemfile", BUNDLE_PATH = "{{config_root}}/vendor/async/bundle", BUNDLE_USER_HOME = "{{config_root}}/vendor/async/bundler", BUNDLE_COOLDOWN = "7" }
run = ["mise install --locked ruby", "mise exec -- ruby ../../scripts/setup_bundler.rb"]

[tasks."test:interop:identity"]
description = "Run the independent identity interop portion"
depends = ["setup", "setup:interop", "fixture:check"]
tools.go = "1.27.3"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/interop/mod", GOCACHE = "{{config_root}}/vendor/interop/build" }
run = "bundle _4.0.23_ exec ruby scripts/interop.rb identity"

[tasks."test:interop:gzip"]
description = "Run the independent gzip interop portion"
depends = ["setup", "setup:interop", "fixture:check"]
tools.go = "1.27.3"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/interop/mod", GOCACHE = "{{config_root}}/vendor/interop/build" }
run = "bundle _4.0.23_ exec ruby scripts/interop.rb gzip"

[tasks."test:conformance:identity"]
description = "Run the independent identity conformance portion"
depends = ["conformance:check"]
tools."github:connectrpc/conformance" = "1.0.6"
run = "bundle _4.0.23_ exec ruby scripts/conformance.rb --profile=identity"

[tasks."test:conformance:gzip"]
description = "Run the independent gzip conformance portion"
depends = ["conformance:check"]
tools."github:connectrpc/conformance" = "1.0.6"
run = "bundle _4.0.23_ exec ruby scripts/conformance.rb --profile=gzip"

# Optional Rack bundle, independent of core, Rails and HTTP/2.

[tasks."rack:setup"]
description = "Install the independent frozen Rack middleware bundle"
depends = ["rack:tools"]
run = "mise exec -- ruby gems/connectrpc-rack/scripts/run.rb setup"

[tasks."rack:test"]
description = "Run optional Rack middleware specs"
depends = ["rack:setup"]
run = "mise exec -- ruby gems/connectrpc-rack/scripts/run.rb test"

[tasks."rack:check"]
description = "Check optional Rack middleware source"
depends = ["rack:setup"]
run = "mise exec -- ruby gems/connectrpc-rack/scripts/run.rb check"

[tasks."rack:build"]
description = "Build isolated core and Rack archives"
depends = ["rack:setup"]
run = "mise exec -- ruby gems/connectrpc-rack/scripts/run.rb build"

[tasks."rack:package"]
description = "Install and exercise normal Rack dependencies offline"
depends = ["rack:build"]
run = "mise exec -- ruby gems/connectrpc-rack/scripts/run.rb package"

[tasks."rack:verify"]
description = "Verify optional Rack specs, source and installed packages"
depends = ["rack:test", "rack:check", "rack:package"]

[tasks."rack:tools"]
description = "Prepare exact Ruby/Bundler for the independent Rack bundle"
dir = "{{config_root}}/gems/connectrpc-rack"
env = { BUNDLE_GEMFILE = "{{config_root}}/gems/connectrpc-rack/Gemfile", BUNDLE_PATH = "{{config_root}}/vendor/rack/bundle", BUNDLE_USER_HOME = "{{config_root}}/vendor/rack/bundler", BUNDLE_COOLDOWN = "7" }
run = ["mise install --locked ruby", "mise exec -- ruby ../../scripts/setup_bundler.rb"]

# Optional in-process testing bundle.

[tasks."testing:setup"]
description = "Install independent frozen testing bundle"
depends = ["testing:tools"]
run = "mise exec -- ruby gems/connectrpc-testing/scripts/run.rb setup"

[tasks."testing:test"]
description = "Run testing transport behavior specs"
depends = ["testing:setup"]
run = "mise exec -- ruby gems/connectrpc-testing/scripts/run.rb test"

[tasks."testing:check"]
description = "Parse and lint maintained testing package files"
depends = ["testing:setup"]
run = "mise exec -- ruby gems/connectrpc-testing/scripts/run.rb check"

[tasks."testing:build"]
description = "Build independent core and testing archives"
depends = ["testing:setup"]
run = "mise exec -- ruby gems/connectrpc-testing/scripts/run.rb build"

[tasks."testing:package"]
description = "Install testing and core offline and exercise generated clients"
depends = ["testing:build"]
run = "mise exec -- ruby gems/connectrpc-testing/scripts/run.rb package"

[tasks."testing:example"]
description = "Run generated in-process unary calls in both codecs"
depends = ["testing:setup"]
run = "mise exec -- ruby gems/connectrpc-testing/scripts/run.rb example"

[tasks."testing:tools"]
description = "Require preinstalled pinned Ruby and Bundler without global installs"
run = "mise exec -- ruby gems/connectrpc-testing/scripts/tools.rb"

[tasks."testing:verify"]
description = "Verify testing transport source, specs, installed package and example"
depends = ["testing:test", "testing:check", "testing:package", "testing:example"]

# Optional static typing tools never enter a runtime or adapter bundle.
[tasks."rbs:setup"]
description = "Install the independent frozen Steep/RBS development bundle"
run = "mise exec -- ruby typecheck/run.rb setup"

[tasks."rbs:check"]
description = "Check official protoc/Buf RBS, strict positive/negative consumers and runtime"
depends = ["rbs:runtime", "rbs:setup", "setup:generation"]
tools."aqua:protocolbuffers/protobuf/protoc" = "36.2"
tools."aqua:bufbuild/buf" = "1.75.0"
run = "ruby typecheck/run.rb check"

[tasks."rbs:package"]
description = "Check installed RBS discovery and consumers outside the checkout"
depends = ["rbs:runtime", "rbs:setup", "setup:generation", "rack:setup", "testing:setup", "setup:rails", "async:setup", "falcon:setup", "otel:setup"]
tools."aqua:protocolbuffers/protobuf/protoc" = "36.2"
tools."aqua:bufbuild/buf" = "1.75.0"
run = "ruby typecheck/run.rb package"

[tasks."rbs:runtime"]
description = "Prepare the frozen fixture runtime bundle with local Bundler state"
depends = ["setup:bundler"]
env.BUNDLE_USER_HOME = "{{config_root}}/vendor/rbs/root-bundler"
run = "bundle _4.0.23_ install"

[tasks."falcon:setup"]
description = "Install the independent frozen Falcon backend bundle"
depends = ["falcon:tools"]
run = "mise exec -- ruby gems/connectrpc-falcon/scripts/run.rb setup"

[tasks."falcon:test"]
description = "Run optional Falcon backend product specs"
depends = ["falcon:setup"]
run = "mise exec -- ruby gems/connectrpc-falcon/scripts/run.rb test"

[tasks."falcon:check"]
description = "Check optional Falcon backend source"
depends = ["falcon:setup"]
run = "mise exec -- ruby gems/connectrpc-falcon/scripts/run.rb check"

[tasks."falcon:build"]
description = "Build isolated core and Falcon backend archives"
depends = ["falcon:setup"]
run = "mise exec -- ruby gems/connectrpc-falcon/scripts/run.rb build"

[tasks."falcon:package"]
description = "Install and exercise normal Falcon gem dependencies offline"
depends = ["falcon:build"]
run = "mise exec -- ruby gems/connectrpc-falcon/scripts/run.rb package"

[tasks."falcon:example"]
description = "Run generated unary Falcon localhost example"
depends = ["falcon:setup"]
run = "mise exec -- ruby gems/connectrpc-falcon/scripts/run.rb example"

[tasks."falcon:interop"]
description = "Run independent connect-go Falcon interoperability"
depends = ["falcon:setup", "setup:interop"]
tools.go = "1.27.3"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/interop/mod", GOCACHE = "{{config_root}}/vendor/interop/build" }
run = "ruby gems/connectrpc-falcon/scripts/run.rb interop"

[tasks."falcon:verify"]
description = "Verify Falcon specs, source, packages and Go interoperability"
depends = ["falcon:test", "falcon:check", "falcon:package", "falcon:interop"]

[tasks."falcon:tools"]
description = "Prepare exact Ruby/Bundler for the independent backend bundle"
dir = "{{config_root}}/gems/connectrpc-falcon"
env = { BUNDLE_GEMFILE = "{{config_root}}/gems/connectrpc-falcon/Gemfile", BUNDLE_PATH = "{{config_root}}/vendor/falcon/bundle", BUNDLE_USER_HOME = "{{config_root}}/vendor/falcon/bundler", BUNDLE_COOLDOWN = "7" }
run = ["mise install --locked ruby", "mise exec -- ruby ../../scripts/setup_bundler.rb"]

# Optional API-only tracing adapter; SDK-backed cross-package development bundle.

[tasks."otel:tools"]
description = "Require preinstalled pinned Ruby and Bundler for OpenTelemetry"
dir = "{{config_root}}/gems/connectrpc-otel"
env = { BUNDLE_GEMFILE = "{{config_root}}/gems/connectrpc-otel/Gemfile", BUNDLE_PATH = "{{config_root}}/vendor/otel/bundle", BUNDLE_USER_HOME = "{{config_root}}/vendor/otel/bundler", BUNDLE_COOLDOWN = "7" }
run = "mise exec -- ruby scripts/tools.rb"

[tasks."otel:setup"]
description = "Install the independent frozen OpenTelemetry development bundle"
depends = ["otel:tools"]
run = "mise exec -- ruby gems/connectrpc-otel/scripts/run.rb setup"

[tasks."otel:test"]
description = "Run SDK-backed RPC and host tracing specs"
depends = ["otel:setup"]
run = "mise exec -- ruby gems/connectrpc-otel/scripts/run.rb test"

[tasks."otel:check"]
description = "Parse and lint OpenTelemetry package source"
depends = ["otel:setup"]
run = "mise exec -- ruby gems/connectrpc-otel/scripts/run.rb check"

[tasks."otel:build"]
description = "Build isolated core and OpenTelemetry archives"
depends = ["otel:setup"]
run = "mise exec -- ruby gems/connectrpc-otel/scripts/run.rb build"

[tasks."otel:package"]
description = "Install and exercise normal API-only tracing dependencies offline"
depends = ["otel:build"]
run = "mise exec -- ruby gems/connectrpc-otel/scripts/run.rb package"

[tasks."otel:example"]
description = "Run generated in-process RPCs with real in-memory traces"
depends = ["otel:setup"]
run = "mise exec -- ruby gems/connectrpc-otel/scripts/run.rb example"

[tasks."otel:verify"]
description = "Verify API-only packages and SDK-backed cross-package tracing"
depends = ["otel:test", "otel:check", "otel:package", "otel:example"]

[tasks."rbs:source"]
description = "Strictly check the ten core implementation files and private state"
depends = ["rbs:setup"]
run = "mise exec -- ruby typecheck/run.rb source"

[tasks."rbs:api"]
description = "Check supported core and every optional package API and exact negative diagnostics"
depends = ["rbs:setup"]
run = "mise exec -- ruby typecheck/run.rb api"

[tasks."rbs:inventory"]
description = "Detect unclassified source methods, changed options/records and signature omissions"
depends = ["rbs:setup"]
run = "mise exec -- ruby typecheck/run.rb inventory"

[tasks."rbs:proof"]
description = "Prove strict source and API drift diagnostics in an independent source capture"
depends = ["rbs:setup"]
run = "mise exec -- ruby typecheck/run.rb proof"

[tasks."test:interop:get"]
description = "Run independent Connect unary GET interoperability"
depends = ["setup", "setup:interop", "fixture:check"]
tools.go = "1.27.3"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/interop/mod", GOCACHE = "{{config_root}}/vendor/interop/build" }
run = "bundle _4.0.23_ exec ruby scripts/interop.rb get"
