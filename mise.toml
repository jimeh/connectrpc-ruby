# Optional reactor-free Rust client transport; independent bundle, pinned Rust
# 1.98.0 (the rb-sys-dock image's) and Rust lint tools.

# mise resolves a task's tools before its run starts, so a toolchain installed
# by the same task's run is not active there (a fresh runner would use its own
# rustc). Install-only tasks run first, as setup:generation does for protoc.
# rustup's profile decides which components a new toolchain gets (CI
# runners use `minimal`), so rustfmt and clippy for hyper:check are added
# explicitly to the pinned toolchain.
[tasks."hyper:toolchain"]
description = "Install the locked Rust 1.98.0 with rustfmt and clippy, cargo-deny and cargo-audit for connectrpc-hyper"
run = [
  "mise install --locked rust@1.98.0 aqua:EmbarkStudios/cargo-deny@0.20.2 aqua:rustsec/rustsec/cargo-audit@0.23.0",
  "mise exec rust@1.98.0 -- rustup component add --toolchain 1.98.0 rustfmt clippy",
]

[tasks."hyper:toolchain:msrv"]
description = "Install the locked MSRV Rust 1.85.0 for connectrpc-hyper"
run = "mise install --locked rust@1.85.0"

[tasks."hyper:toolchain:go"]
description = "Install the locked Go 1.27.3 for the connectrpc-hyper peer"
run = "mise install --locked go@1.27.3"

[tasks."hyper:tools"]
description = "Require pinned Rust, cargo-deny, cargo-audit, Ruby and Bundler for connectrpc-hyper"
depends = ["hyper:toolchain"]
dir = "{{config_root}}/gems/connectrpc-hyper"
tools.rust = "1.98.0"
tools."aqua:EmbarkStudios/cargo-deny" = "0.20.2"
tools."aqua:rustsec/rustsec/cargo-audit" = "0.23.0"
env = { BUNDLE_GEMFILE = "{{config_root}}/gems/connectrpc-hyper/Gemfile", BUNDLE_PATH = "{{config_root}}/vendor/hyper/bundle", BUNDLE_USER_HOME = "{{config_root}}/vendor/hyper/bundler", BUNDLE_COOLDOWN = "3" }
run = "ruby scripts/tools.rb"

[tasks."hyper:setup"]
description = "Install the independent connectrpc-hyper bundle and compile the extension for the active Ruby"
depends = ["hyper:tools"]
tools.rust = "1.98.0"
run = "ruby gems/connectrpc-hyper/scripts/run.rb setup"

[tasks."hyper:peer"]
description = "Build the disposable grpc-go/connect-go/raw HTTP/2 peer used by connectrpc-hyper specs"
depends = ["hyper:toolchain:go"]
tools.go = "1.27.3"
dir = "{{config_root}}/gems/connectrpc-hyper/interop"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/hyper/go/mod", GOCACHE = "{{config_root}}/vendor/hyper/go/build" }
run = ["go mod download all", "go mod verify", "go vet .", "go build -o ../../../vendor/hyper/peer ."]

[tasks."hyper:test"]
description = "Run connectrpc-hyper specs against local Go peers: interop, limits, interrupts, pooling, retries, liveness, fork, TLS and offload"
depends = ["hyper:setup", "hyper:peer"]
tools.rust = "1.98.0"
run = "ruby gems/connectrpc-hyper/scripts/run.rb test"

[tasks."hyper:check"]
description = "Parse and lint connectrpc-hyper Ruby, then cargo fmt, clippy -D warnings, cargo deny, cargo audit and notices"
depends = ["hyper:setup"]
tools.rust = "1.98.0"
tools."aqua:EmbarkStudios/cargo-deny" = "0.20.2"
tools."aqua:rustsec/rustsec/cargo-audit" = "0.23.0"
run = "ruby gems/connectrpc-hyper/scripts/run.rb check"

[tasks."hyper:build"]
description = "Build isolated core and connectrpc-hyper source archives"
depends = ["hyper:setup"]
run = "ruby gems/connectrpc-hyper/scripts/run.rb build"

[tasks."hyper:package"]
description = "Install the connectrpc-hyper source gem offline from a pre-fetched locked crate cache, outside the checkout, and smoke it"
depends = ["hyper:build"]
tools.rust = "1.98.0"
run = "ruby gems/connectrpc-hyper/scripts/run.rb package"

[tasks."hyper:interop"]
description = "Verify the Go peer modules and run the connectrpc-hyper grpc-go/connect-go interop matrix"
depends = ["hyper:setup", "hyper:peer"]
tools.rust = "1.98.0"
tools.go = "1.27.3"
env = { GOTOOLCHAIN = "local", GOWORK = "off", GOFLAGS = "-mod=readonly", GOMODCACHE = "{{config_root}}/vendor/hyper/go/mod", GOCACHE = "{{config_root}}/vendor/hyper/go/build" }
run = "ruby gems/connectrpc-hyper/scripts/run.rb interop"

[tasks."hyper:cross"]
description = "Cross-build one connectrpc-hyper gem with rb-sys-dock into vendor/hyper/cross/<platform> (PLATFORM or `-- <platform>`; `ruby` builds the source gem)"
depends = ["hyper:tools"]
run = "ruby gems/connectrpc-hyper/scripts/run.rb cross"

