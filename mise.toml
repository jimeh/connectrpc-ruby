# Pins-lifted canary lane: non-gating, run daily by .github/workflows/canary.yml.
# CONNECTRPC_DEPENDENCY_CANARY=1 makes the launcher use an ignored Gemfile.canary
# wrapper that lifts each third-party `~> x.y.z` patch pin of the local packages
# to `< next major`, with its own lock, bundle path and Bundler user state under
# vendor/<pkg>/canary; see scripts/dependency_canary.rb and scripts/canary_driver.rb.
# Each run resolves fresh.
[tasks."canary:async"]
description = "Non-gating pins-lifted canary: Async upstream contract and suite with patch pins lifted"
depends = ["async:tools"]
env.CONNECTRPC_DEPENDENCY_CANARY = "1"
run = [
  "rm -f gems/connectrpc-async/Gemfile.canary.lock",
  "mise exec -- ruby gems/connectrpc-async/scripts/run.rb setup",
  "mise exec -- ruby gems/connectrpc-async/scripts/run.rb canary",
]

[tasks."canary:falcon"]
description = "Non-gating pins-lifted canary: Falcon upstream contract and suite with patch pins lifted"
depends = ["falcon:tools"]
env.CONNECTRPC_DEPENDENCY_CANARY = "1"
run = [
  "rm -f gems/connectrpc-falcon/Gemfile.canary.lock",
  "mise exec -- ruby gems/connectrpc-falcon/scripts/run.rb setup",
  "mise exec -- ruby gems/connectrpc-falcon/scripts/run.rb canary",
]

# The hyper canary lifts the committed Cargo.lock instead: `cargo update` in a
# temporary copy of the package, then the specs against that build. The
# tracked tree and the development extension stay unchanged.
[tasks."canary:hyper"]
description = "Non-gating newest-crates canary: cargo update in a temporary copy, rebuild and run connectrpc-hyper specs"
depends = ["hyper:tools", "hyper:peer"]
tools.rust = "1.98.0"
run = "ruby gems/connectrpc-hyper/scripts/canary.rb"

[tasks.canary]
description = "Run every non-gating canary lane (Ruby 3.4.12)"
depends = ["canary:async", "canary:falcon", "canary:hyper"]

# Long-running lifecycle campaign: non-gating, run nightly by .github/workflows/soak.yml.
# scripts/soak.rb supervises each package's soak/ scenarios with a run deadline and
# cleanup budget; reports go to vendor/<pkg>/soak/<ruby>/. See docs/development.md.
[tasks."async:soak"]
description = "Run the Async H2 client/Host and ThreadedTransport lifecycle campaign (non-gating)"
depends = ["async:setup"]
run = "mise exec -- ruby scripts/soak.rb async"

[tasks."falcon:soak"]
description = "Run the Falcon HTTP/2 and HTTP/1.1 lifecycle campaign (non-gating)"
depends = ["falcon:setup"]
run = "mise exec -- ruby scripts/soak.rb falcon"

[tasks.soak]
description = "Run both lifecycle campaigns, Async then Falcon even if Async fails (non-gating)"
depends = ["async:setup", "falcon:setup"]
run = "mise exec -- ruby scripts/soak.rb async falcon"

# Release preparation never tags, creates a GitHub release, or publishes gems.
[tasks."release:check"]
description = "Check twelve synchronized versions (eleven published), installation guides and release guards offline"
run = "mise exec -- ruby scripts/release.rb check"

[tasks."release:prepare"]
description = "Refresh installation guide requirements after a minor (breaking) release version update"
run = "mise exec -- ruby scripts/release.rb prepare"

[tasks."release:prepare:pr"]
description = "CI only (release-please.yml on main): commit prepared installation guides to the release PR branch as the release App"
run = "mise exec -- ruby scripts/release.rb prepare-pr"

[tasks."release:build"]
description = "Build and compare eleven canonical candidate archives from a clean Ruby 3.4.12 checkout"
run = "mise exec -- ruby scripts/release.rb build"

[tasks."release:tools"]
description = "Install the frozen Sigstore signing bundle used by the release workflow"
run = "mise exec -- ruby scripts/release.rb tools"

[tasks."release:publish"]
description = "CI only (release.yml on a v* tag): attest, push and publish the built candidate"
run = "mise exec -- ruby scripts/release.rb publish"

[tasks."release:candidate"]
description = "Validate installed combinations, generated consumers and canonical candidate archives"
depends = ["release:check", "generation:check", "grpc:status:check", "check:package", "rack:package", "check:package:rails", "async:package", "falcon:package", "testing:package", "otel:package", "prometheus:package", "yabeda:package", "health:package", "sentry:package", "rbs:package"]
run = "mise run release:build"
